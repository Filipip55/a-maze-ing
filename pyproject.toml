[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator module for the A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "icoman, edingwiz" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
[tool.setuptools]
packages = ["mazegen"]
